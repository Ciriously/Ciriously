<svg xmlns="http://www.w3.org/2000/svg" width="440" height="170" viewBox="0 0 440 170" font-family="Tahoma, Verdana, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="tb" x1="0" x2="1"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient>
  </defs>
  <g shape-rendering="crispEdges">
    <rect width="440" height="170" fill="#000"/>
    <rect width="439" height="169" fill="#dfdfdf"/>
    <rect x="1" y="1" width="438" height="168" fill="#808080"/>
    <rect x="1" y="1" width="437" height="167" fill="#fff"/>
    <rect x="2" y="2" width="436" height="166" fill="#c0c0c0"/>
    <rect x="4" y="4" width="432" height="20" fill="url(#tb)"/>
    <!-- close button -->
    <rect x="416" y="7" width="16" height="14" fill="#000"/>
    <rect x="416" y="7" width="15" height="13" fill="#fff"/>
    <rect x="417" y="8" width="14" height="12" fill="#808080"/>
    <rect x="417" y="8" width="13" height="11" fill="#dfdfdf"/>
    <rect x="418" y="9" width="12" height="10" fill="#c0c0c0"/>
    <!-- Wait (default button) -->
    <rect x="132" y="126" width="84" height="26" fill="#000"/>
    <rect x="133" y="127" width="82" height="24" fill="#000"/>
    <rect x="133" y="127" width="81" height="23" fill="#fff"/>
    <rect x="134" y="128" width="80" height="22" fill="#808080"/>
    <rect x="134" y="128" width="79" height="21" fill="#dfdfdf"/>
    <rect x="135" y="129" width="78" height="20" fill="#c0c0c0"/>
    <rect x="138.5" y="131.5" width="71" height="15" fill="none" stroke="#000" stroke-dasharray="1 1"/>
    <!-- End task (disabled) -->
    <rect x="224" y="126" width="84" height="26" fill="#000"/>
    <rect x="224" y="126" width="83" height="25" fill="#fff"/>
    <rect x="225" y="127" width="82" height="24" fill="#808080"/>
    <rect x="225" y="127" width="81" height="23" fill="#dfdfdf"/>
    <rect x="226" y="128" width="80" height="22" fill="#c0c0c0"/>
  </g>
  <path d="M420.5 10.5l7 7m0-7l-7 7" stroke="#000" stroke-width="2"/>
  <text x="10" y="18" fill="#fff" font-size="12" font-weight="bold">aditya.exe</text>

  <circle cx="36" cy="62" r="16" fill="#e81123" stroke="#000"/>
  <path d="M30 56l12 12m0-12l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

  <text font-size="12" fill="#000">
    <tspan x="68" y="58">aditya.exe is not responding.</tspan>
    <tspan x="68" y="84">last seen saying “this’ll take 5 minutes”</tspan>
    <tspan x="68" y="100">four hours ago.</tspan>
  </text>

  <text x="174" y="143" font-size="12" text-anchor="middle" fill="#000">Wait</text>
  <text x="267" y="144" font-size="12" text-anchor="middle" fill="#fff">End task</text>
  <text x="266" y="143" font-size="12" text-anchor="middle" fill="#808080">End task</text>
</svg>
